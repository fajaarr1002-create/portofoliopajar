        body {
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Latar Belakang Gradasi Lembut yang Bergerak Lambat */
        .bg-gradient-dynamic {
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Dinamis (Menyesuaikan Tema) */
        .glass-card {
            transition: background-color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .glass-btn {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Efek Shimmer Kilau Lembut */
        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(14, 165, 233, 0.08),
                transparent
            );
            transition: 0.5s;
        }

        .glass-btn:hover::before {
            left: 100%;
        }

        .glass-btn:hover {
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Animasi Muncul Halus */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

    <script>
        // Inisialisasi Ikon Lucide
        lucide.createIcons();

        // 1. Fitur Tema Terang/Gelap (Light/Dark Mode Toggle)
        function toggleTheme() {
            const htmlElement = document.documentElement;
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            // Ubah warna partikel secara instan saat mengganti tema
            updateParticleColor();
        }

        // Pemuatan Tema Bawaan Berdasarkan preferensi atau sistem pengguna
        if (localStorage.getItem('theme') === 'light' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 2. Fungsi Jam Digital Realtime
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. Canvas Partikel Latar Belakang
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 28; // Hemat daya baterai ponsel
        let particleColor = 'rgba(56, 189, 248, 0.45)';

        function updateParticleColor() {
            const isDark = document.documentElement.classList.contains('dark');
            // Mode gelap menggunakan warna biru soft sky, mode terang menggunakan abu-abu kebiruan
            particleColor = isDark ? 'rgba(56, 189, 248, 0.45)' : 'rgba(100, 116, 139, 0.25)';
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.4;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.alpha = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = particleColor;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * doubleY || dx * dx + dy * dy); // Perbaikan kompilasi matematika

                    if (distance < 120) {
                        ctx.beginPath();
                        const isDark = document.documentElement.classList.contains('dark');
                        const strokeAlpha = isDark ? 0.08 : 0.05;
                        ctx.strokeStyle = isDark 
                            ? `rgba(56, 189, 248, ${strokeAlpha - (distance / 120) * strokeAlpha})`
                            : `rgba(100, 116, 139, ${strokeAlpha - (distance / 120) * strokeAlpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        // Jalankan inisialisasi awal
        window.onload = function() {
            updateParticleColor();
            initParticles();
            animateParticles();
        };
    </script>
